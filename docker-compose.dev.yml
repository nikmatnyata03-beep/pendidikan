services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus-dev-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - nexus-postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      NEXUS_ENVIRONMENT: development
      NEXUS_DATABASE_URL: postgresql://nexus:nexus-dev-only@postgres:5432/nexus
      NEXUS_OIDC_ISSUER: https://sso.example.edu/realms/campus
      NEXUS_OIDC_AUDIENCE: nexus-campus-api
      NEXUS_OIDC_JWKS_URL: https://sso.example.edu/realms/campus/protocol/openid-connect/certs
      NEXUS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nexus-postgres:
